name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Enable uinput for headless input tests
        run: |
          sudo modprobe uinput
          # The virtual-device tests create/read uinput devices; udev's
          # default rule makes /dev/uinput root-only, so open it up for
          # the test run (CI-only, ephemeral runner).
          sudo chmod a+rw /dev/uinput
          ls -l /dev/uinput

      - name: Run test suite
        run: cargo test --verbose -- --nocapture
